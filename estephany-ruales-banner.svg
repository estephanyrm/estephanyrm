<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe1f0"/>
      <stop offset="45%" stop-color="#f6d2f4"/>
      <stop offset="100%" stop-color="#d9c8fb"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8fc7"/>
      <stop offset="55%" stop-color="#d88ee8"/>
      <stop offset="100%" stop-color="#b295f0"/>
    </linearGradient>

    <filter id="softWobble" x="-20%" y="-30%" width="140%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.06" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#c48ce0" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="900" height="260" fill="url(#bgGrad)"/>

  <!-- soft blob shapes -->
  <circle cx="80" cy="50" r="70" fill="#ffffff" opacity="0.25"/>
  <circle cx="830" cy="210" r="90" fill="#ffffff" opacity="0.22"/>
  <circle cx="820" cy="40" r="40" fill="#ffffff" opacity="0.3"/>

  <!-- sparkles / stars -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M100 190 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
    <path d="M780 150 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z"/>
    <path d="M60 130 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
    <path d="M840 110 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
  </g>
  <g fill="#fff6fb" opacity="0.8">
    <circle cx="150" cy="60" r="3"/>
    <circle cx="200" cy="220" r="3"/>
    <circle cx="700" cy="60" r="3"/>
    <circle cx="750" cy="230" r="3"/>
  </g>

  <!-- little hearts -->
  <g fill="#ffb6de" opacity="0.75">
    <path d="M130 210 c-6-8-18-6-18 3 c0 8 12 14 18 20 c6-6 18-12 18-20 c0-9-12-11-18-3 z"/>
    <path d="M800 90 c-5-6-14-5-14 2 c0 6 9 11 14 16 c5-5 14-10 14-16 c0-7-9-8-14-2 z"/>
  </g>

  <!-- main title, soft wobble -->
  <text x="450" y="145" text-anchor="middle"
        font-family="'Comic Sans MS','Trebuchet MS',sans-serif" font-weight="800"
        font-size="64" letter-spacing="1"
        fill="url(#textGrad)" filter="url(#softWobble)" style="paint-order: stroke; stroke: #ffffff; stroke-width: 3px;">Estephany Ruales</text>

  <text x="450" y="145" text-anchor="middle"
        font-family="'Comic Sans MS','Trebuchet MS',sans-serif" font-weight="800"
        font-size="64" letter-spacing="1"
        fill="url(#textGrad)" filter="url(#softShadow)" opacity="0.55">Estephany Ruales</text>

  <!-- subtitle -->
  <text x="450" y="200" text-anchor="middle"
        font-family="'Trebuchet MS',sans-serif" font-size="20" letter-spacing="3"
        fill="#8a5fb8" opacity="0.9">✨ Software Developer · Systems Engineering Student ✨</text>

  <!-- soft border -->
  <rect x="6" y="6" width="888" height="248" rx="24" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
</svg>
